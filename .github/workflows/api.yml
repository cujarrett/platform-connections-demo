name: api

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  pull_request:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod

      - name: Test
        working-directory: api
        run: go test ./...

      - name: Lint
        working-directory: api
        run: go vet ./...

  build-and-push:
    needs: api-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/platform-connections-demo-api
      tags: |
        ghcr.io/cujarrett/platform-connections-demo-api:latest
        ghcr.io/cujarrett/platform-connections-demo-api:sha-${{ github.sha }}
      context: api
      cache-scope: api

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    uses: cujarrett/homelab-workspaces/.github/workflows/update-image-tag.yml@main
    with:
      # image must be set - the default derives from the repo name, and this repo
      # builds three differently-named images out of one tree.
      image: ghcr.io/cujarrett/platform-connections-demo-api
      file: platform-connections-demo/upstream-api.yaml
    secrets:
      app_private_key: ${{ secrets.HOMELAB_WORKSPACES_APP_KEY }}
