name: downstream

on:
  push:
    branches: [main]
    paths:
      - 'downstream/**'
  pull_request:
  workflow_dispatch:

jobs:
  downstream-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: downstream/go.mod

      - name: Test
        working-directory: downstream
        run: go test ./...

      - name: Lint
        working-directory: downstream
        run: go vet ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: downstream-test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: downstream
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cujarrett/platform-connections-demo-downstream:latest
            ghcr.io/cujarrett/platform-connections-demo-downstream:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    # One image, two XR instances. max-parallel keeps the two commits from racing
    # each other on the same branch.
    strategy:
      max-parallel: 1
      matrix:
        file:
          - platform-connections-demo/authorized-api.yaml
          - platform-connections-demo/unauthorized-api.yaml
    uses: cujarrett/homelab-workspaces/.github/workflows/update-image-tag.yml@main
    with:
      # image must be set - the default derives from the repo name, and this repo
      # builds three differently-named images out of one tree.
      image: ghcr.io/cujarrett/platform-connections-demo-downstream
      file: ${{ matrix.file }}
    secrets:
      homelab_pat: ${{ secrets.HOMELAB_WORKSPACES_PAT }}
