name: pin-check

# Fails when a code link pinned in spa/src/app/cases.ts no longer matches homelab main.
# github-exporter reports this workflow's latest result, and a failure alerts Discord.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "spa/src/app/cases.ts"
      - "spa/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Compare pinned blocks with main
        working-directory: spa
        run: node scripts/check-pins.ts
