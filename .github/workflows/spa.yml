name: spa

on:
  push:
    branches: [main]
    paths:
      - 'spa/**'
  pull_request:
  workflow_dispatch:

jobs:
  # Gates the build, matching api and downstream. There are no specs yet, so the
  # check is formatting plus a full typecheck - tsc --noEmit is a real gate for a
  # TypeScript app, and an always-green empty suite would be a worse signal.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install
        working-directory: spa
        run: npm ci

      - name: Format check
        working-directory: spa
        run: npm run format:check

      - name: Lint
        working-directory: spa
        run: npm run lint

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: spa
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cujarrett/platform-connections-demo-spa:latest
            ghcr.io/cujarrett/platform-connections-demo-spa:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    uses: cujarrett/homelab-workspaces/.github/workflows/update-image-tag.yml@main
    with:
      # image must be set - the default derives from the repo name, and this repo
      # builds three differently-named images out of one tree.
      image: ghcr.io/cujarrett/platform-connections-demo-spa
      file: platform-connections-demo/connections-demo.yaml
    secrets:
      homelab_pat: ${{ secrets.HOMELAB_PAT }}
